name: Apply priority compatibility follow-up

on:
  push:
    branches:
      - refactor/worker-priority-layers

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix worker priority compatibility edge case'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/worker-priority-layers
      - name: Apply follow-up
        run: python tools/patch_priority_followup.py
      - name: Commit follow-up
        run: |
          git config user.name "andr8076"
          git config user.email "17514629+andr8076@users.noreply.github.com"
          git add FarmStore.php farm_api.php
          git diff --cached --check
          git commit -m "Fix worker priority compatibility edge case"
          git push origin HEAD:refactor/worker-priority-layers
